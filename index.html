<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Invaders</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090d1f; }
    body { display: grid; place-items: center; font-family: "Courier New", monospace; touch-action: none; }
    #game-shell { position: relative; width: min(100vw, 1280px); height: min(100dvh, 720px); overflow: hidden; background: #080b18; }
    canvas { width: 100%; height: 100%; display: block; }
    #hud { position: absolute; inset: 18px 24px auto; display: flex; justify-content: space-between; align-items: start; pointer-events: none; color: #edf4ff; text-transform: uppercase; font-size: clamp(11px, 1.8vw, 16px); letter-spacing: 2px; text-shadow: 0 2px 10px #000; }
    #hud strong { display: block; margin-top: 5px; color: #50e6ff; font-size: 1.25em; letter-spacing: 1px; }
    #level { text-align: right; }
    #overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 8, 20, .45); opacity: 0; pointer-events: none; transition: opacity .2s; }
    #overlay.show { opacity: 1; pointer-events: auto; }
    .panel { min-width: 280px; text-align: center; color: white; border: 1px solid rgba(94, 224, 255, .25); background: rgba(8, 13, 34, .92); padding: 28px 36px 24px; box-shadow: 0 20px 60px #0009; }
    .panel h1 { margin: 0 0 8px; color: #fff; font-size: clamp(28px, 7vw, 54px); letter-spacing: 5px; }
    .panel p { margin: 8px 0 20px; color: #8ca0bd; font-size: 14px; letter-spacing: 1px; }
    button { appearance: none; border: 1px solid #54dff7; border-radius: 2px; background: #1d6d8a; color: white; padding: 12px 22px; font: 700 13px "Courier New", monospace; letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 22px #34d4ff55; }
    #controls { position: absolute; inset: auto 12px 18px; display: none; justify-content: space-between; pointer-events: none; }
    .control { width: 72px; height: 72px; border: 1px solid #62d8ef55; border-radius: 50%; background: #18315088; color: #aef2ff; font-size: 28px; pointer-events: auto; user-select: none; }
    .control:active { background: #2a7892aa; }
    #move-controls { display: flex; gap: 10px; }
    @media (pointer: coarse), (max-width: 800px) { #controls { display: flex; } #hud { inset: 10px 14px auto; } }
  </style>
</head>
<body>
  <div id="game-shell">
    <canvas id="game"></canvas>
    <div id="hud"><div>SCORE<strong id="score">00000</strong></div><div>LIVES<strong id="lives">♥ ♥ ♥</strong></div><div id="level">WAVE<strong id="wave">01</strong></div></div>
    <div id="overlay" class="show"><div class="panel"><h1 id="title">INVADERS</h1><p id="subtitle">DEFEND THE LAST OUTPOST</p><button id="start">START</button></div></div>
    <div id="controls"><div id="move-controls"><button class="control" id="left" aria-label="Move left">◀</button><button class="control" id="right" aria-label="Move right">▶</button></div><button class="control" id="fire" aria-label="Fire">●</button></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
